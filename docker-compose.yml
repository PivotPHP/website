services:
  # Serviço para desenvolvimento com hot-reload.
  # Único serviço iniciado por `docker compose up` (os demais usam profiles).
  jekyll:
    build: .
    command: bundle exec jekyll serve --config _config.yml,_config.dev.yml --watch --force_polling --incremental --livereload --host 0.0.0.0
    # Em Linux, usar network_mode: host pode ajudar em ambientes restritos de DNS
    # (não funciona em Docker Desktop para Mac/Windows)
    network_mode: host
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development
    user: "${UID:-1000}:${GID:-1000}"

  # Serviço para build de produção e testes.
  # Opt-in: docker compose --profile build run --rm jekyll-build
  # Grava em _site-build/ (não sobrescreve o _site/ do dev).
  jekyll-build:
    build: .
    profiles: ["build"]
    command: bundle exec jekyll build --verbose --destination _site-build
    network_mode: host
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    environment:
      - JEKYLL_ENV=production
    user: "${UID:-1000}:${GID:-1000}"

  # Serviço para servir build de produção.
  # Opt-in: docker compose --profile production up jekyll-production
  # Grava em _site-production/ (não sobrescreve o _site/ do dev).
  jekyll-production:
    build: .
    profiles: ["production"]
    command: bundle exec jekyll serve --no-watch --host 0.0.0.0 --destination _site-production
    network_mode: host
    ports:
      - "4000:4000"
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    environment:
      - JEKYLL_ENV=production
    user: "${UID:-1000}:${GID:-1000}"

volumes:
  bundle_cache:
