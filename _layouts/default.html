<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}" class="no-js">

{% include head.html %}

<body>
  <!-- Navigation Simplificada -->
  <nav class="navbar">
    <div class="container">
      <div class="navbar-inner">
        <a href="{{ '/pt/docs/' | relative_url }}" class="navbar-brand">
          <img src="{{ '/assets/images/pivotphp-logo.svg' | relative_url }}" alt="PivotPHP Logo">
          <span class="navbar-brand-text">PivotPHP</span>
        </a>

        <button class="mobile-menu-toggle" aria-label="Toggle navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <ul class="navbar-nav">
          <li>
            <!-- Theme Toggle -->
            <button class="theme-toggle-btn" data-theme-toggle aria-label="Toggle theme">
              <svg class="theme-icon theme-icon-light" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/>
              </svg>
              <svg class="theme-icon theme-icon-dark" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
              </svg>
            </button>
          </li>
          <li>
            {% include version-switcher.html %}
            </li>
            <li>
            <div class="language-switcher">
              <select onchange="switchLanguage(this.value)">
                <option value="pt" {% if page.lang=='pt' %}selected{% endif %}>🇧🇷 PT</option>
                <option value="en" {% if page.lang=='en' %}selected{% endif %}>🇺🇸 EN</option>
              </select>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main>
    {{ content }}
  </main>

  {% include cookie-consent-modal.html %}
  {% include footer.html %}

  <!-- Scripts -->
  <script src="{{ '/assets/js/cookie-manager.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/mobile-nav.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/language-persistence.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/banner-persistence.js' | relative_url }}"></script>

  <script>
    // Language switching logic - Simplified
    function switchLanguage(lang) {
      if (typeof window.LanguageRoutes !== 'undefined') {
        // Get current language
        const currentLang = window.LanguageRoutes.getCurrentLang();

        // Convert URL using LanguageRoutes (it handles baseUrl internally)
        const newUrl = window.LanguageRoutes.convertUrl(window.location.pathname, currentLang, lang);

        // Store language preference
        if (lang !== 'en') {
          localStorage.setItem('preferred-language', lang);
        } else {
          localStorage.removeItem('preferred-language');
        }

        // Navigate to new URL
        window.location.href = newUrl;
      } else {
        // Fallback for simple switching
        console.warn('LanguageRoutes not available, using simple switching');
        const currentPath = window.location.pathname;
        const baseUrl = '{{ site.baseurl | default: "" }}';

        let relativePath = currentPath;
        if (baseUrl && currentPath.startsWith(baseUrl)) {
          relativePath = currentPath.substring(baseUrl.length);
        }

        let newPath;
        if (lang === 'en') {
          newPath = relativePath.replace(/^\/pt\//, '/');
        } else if (lang === 'pt') {
          if (!relativePath.startsWith('/pt/')) {
            newPath = '/pt' + relativePath;
          } else {
            newPath = relativePath;
          }
        }

        window.location.href = baseUrl + newPath;
      }
    }

  // Cookie consent (funcional apenas)
  document.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById('cookie-consent');
    if (!modal) return;

    const storedMode = (() => {
      try { return localStorage.getItem('pivotphp-cookies-mode'); } catch (e) { return null; }
    })();

    const showModal = !storedMode;
    if (showModal) {
      modal.hidden = false;
    }

    const acceptBtn = modal.querySelector('[data-consent="accept"]');
    const fallbackBtn = modal.querySelector('[data-consent="fallback"]');

    const acceptCookies = () => {
      if (window.CookieManager) {
        window.CookieManager.setCookiesMode(window.CookieManager.MODES.COOKIES);
        window.CookieManager.setCookie('pivotphp-consent', 'true', 180);
        window.CookieManager.scheduleRenewal('pivotphp-consent', 7, 3);
      } else {
        try { localStorage.setItem('pivotphp-cookies-mode', 'cookies'); } catch (e) { }
      }
      modal.remove();
    };

    const fallback = () => {
      try { localStorage.setItem('pivotphp-cookies-mode', 'localStorage'); } catch (e) { }
      modal.remove();
    };

    if (acceptBtn) acceptBtn.addEventListener('click', acceptCookies);
    if (fallbackBtn) fallbackBtn.addEventListener('click', fallback);
  });
</script>
