<div
  class="cookie-consent-modal"
  id="cookie-consent"
  role="dialog"
  aria-live="polite"
  aria-label="Aviso de cookies"
  hidden
>
  <div class="cookie-consent__content">
    <p class="cookie-consent__text">
      Este site usa cookies funcionais para salvar suas preferências de
      visualização. Nenhum dado é compartilhado com terceiros.
    </p>
    <div class="cookie-consent__actions">
      <button
        type="button"
        class="cookie-consent__btn cookie-consent__btn-primary"
        data-consent="accept"
      >
        Entendi
      </button>
      <button
        type="button"
        class="cookie-consent__btn cookie-consent__btn-secondary"
        data-consent="fallback"
      >
        Usar apenas localStorage
      </button>
    </div>
  </div>
</div>
