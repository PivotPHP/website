<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecionando...</title>
    <script>
      // Detecta idioma salvo no localStorage
      var savedLang = localStorage.getItem("pivotphp-lang") || "pt";
      var targetUrl = "/" + savedLang + "/docs/";

      // Redireciona imediatamente
      window.location.replace(targetUrl);
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/pt/docs/" />
    </noscript>
  </head>
  <body>
    <p>Redirecionando para a documentação...</p>
    <p>
      Se não for redirecionado automaticamente,
      <a href="/pt/docs/">clique aqui</a>.
    </p>
  </body>
</html>
